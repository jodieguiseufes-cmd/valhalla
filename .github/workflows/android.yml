name: Android

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Какие процессоры собирать'
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - all

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version-file: cores/go.mod
          cache: false

      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      - name: Install gomobile
        run: |
          cd cores
          go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          "$(go env GOPATH)/bin/gomobile" init || true

      - name: Apply Valhalla branding
        run: |
          python3 -m pip install --break-system-packages pillow
          bash branding/apply.sh

      - name: Signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd YPtun
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            ALIAS="$KS_ALIAS"; PASS="$KS_PASS"
            echo "Using the permanent signing key"
          else
            ALIAS=valhalla-test; PASS=$(openssl rand -hex 12)
            keytool -genkeypair -keystore release.keystore -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Valhalla"
            echo "::warning::Temporary test key: do not publish this APK; builds with another key cannot update it"
          fi
          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$PASS" "$ALIAS" "$PASS" > keystore.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: YPtun
        run: |
          chmod +x gradlew
          EXTRA=""
          if [ "${{ inputs.abi }}" = "arm64-v8a" ]; then EXTRA="-Polcbox.android.abiFilters=arm64-v8a"; fi
          ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace $EXTRA

      - uses: actions/upload-artifact@v4
        with:
          name: Valhalla-apk
          path: YPtun/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "test-${{ github.run_number }}" YPtun/androidApp/build/outputs/apk/release/*.apk --prerelease --title "Valhalla test ${{ github.run_number }}" --notes "Test build, signed with a temporary key."

  smoke:
    needs: build
    if: ${{ inputs.abi == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Valhalla-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r apk/Valhalla-1.0.0-universal-release.apk
            adb shell pm grant com.vlhnet.valhalla android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell monkey -p com.vlhnet.valhalla -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > apk/full.log
            adb shell pidof com.vlhnet.valhalla > apk/pid.txt || true

      - name: Report
        if: always()
        run: |
          {
            echo '## Smoke test (emulator, Android 14)'
            if [ -s apk/pid.txt ]; then echo 'The app was still running after 25 seconds.'; else echo 'The app is NOT running (it crashed or exited).'; fi
            echo '### Crash'
            echo '```'
            grep -n -A45 'FATAL EXCEPTION' apk/full.log | head -90 || true
            echo '```'
            echo '### App log lines'
            echo '```'
            grep -iE 'olcbox|valhalla|AndroidRuntime' apk/full.log | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
